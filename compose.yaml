services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: prevclima
      MYSQL_USER: prevclima
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-root-me}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-change-root-me}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    image: prevclima-api:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://prevclima:change-me@db:3306/prevclima?charset=utf8mb4}
      JWT_SECRET: ${JWT_SECRET:-development-secret-change-before-production}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:18080,http://127.0.0.1:18080}
      INMET_SYNC_INTERVAL_MINUTES: ${INMET_SYNC_INTERVAL_MINUTES:-60}
      INMET_SYNC_IN_SERVER: "false"
      OWNER_NAME: ${OWNER_NAME:-Conta principal}
      OWNER_EMAIL: ${OWNER_EMAIL:-}
      OWNER_PASSWORD: ${OWNER_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      INMET_WARNING_RSS_URL: ${INMET_WARNING_RSS_URL:-https://apiprevmet3.inmet.gov.br/avisos/rss}
      INMET_ENABLED: ${INMET_ENABLED:-true}
      INMET_OBSERVATIONS_ENABLED: ${INMET_OBSERVATIONS_ENABLED:-true}
      INMET_TIMEOUT_SECONDS: ${INMET_TIMEOUT_SECONDS:-8}
      INMET_MAX_RESPONSE_BYTES: ${INMET_MAX_RESPONSE_BYTES:-2000000}
      OPEN_METEO_ENABLED: ${OPEN_METEO_ENABLED:-true}
      OPEN_METEO_API_URL: ${OPEN_METEO_API_URL:-https://api.open-meteo.com/v1/forecast}
      OPEN_METEO_GEOCODING_URL: ${OPEN_METEO_GEOCODING_URL:-https://geocoding-api.open-meteo.com/v1/search}
      OPEN_METEO_TIMEOUT_SECONDS: ${OPEN_METEO_TIMEOUT_SECONDS:-8}
      OPEN_METEO_MAX_RESPONSE_BYTES: ${OPEN_METEO_MAX_RESPONSE_BYTES:-1000000}
      OPEN_METEO_CACHE_MINUTES: ${OPEN_METEO_CACHE_MINUTES:-15}
      OPEN_METEO_STALE_HOURS: ${OPEN_METEO_STALE_HOURS:-24}
      MAPTILER_KEY: ${MAPTILER_KEY:-}
    ports:
      - "${PREVCLIMA_BIND:-127.0.0.1}:${PREVCLIMA_PORT:-18080}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3).close()"
      interval: 5s
      timeout: 4s
      retries: 24
      start_period: 20s

  inmet-worker:
    image: prevclima-api:local
    command: ["python", "-m", "app.sync_inmet", "--loop"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://prevclima:change-me@db:3306/prevclima?charset=utf8mb4}
      JWT_SECRET: ${JWT_SECRET:-development-secret-change-before-production}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      INMET_ENABLED: ${INMET_ENABLED:-true}
      INMET_WARNING_RSS_URL: ${INMET_WARNING_RSS_URL:-https://apiprevmet3.inmet.gov.br/avisos/rss}
      INMET_TIMEOUT_SECONDS: ${INMET_TIMEOUT_SECONDS:-8}
      INMET_MAX_RESPONSE_BYTES: ${INMET_MAX_RESPONSE_BYTES:-2000000}
      INMET_SYNC_INTERVAL_MINUTES: ${INMET_SYNC_INTERVAL_MINUTES:-60}

  station-worker:
    image: prevclima-api:local
    command: ["python", "-m", "app.sync_stations", "--loop"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://prevclima:change-me@db:3306/prevclima?charset=utf8mb4}
      JWT_SECRET: ${JWT_SECRET:-development-secret-change-before-production}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:18080,http://127.0.0.1:18080}
      INMET_OBSERVATIONS_ENABLED: ${INMET_OBSERVATIONS_ENABLED:-true}
      INMET_STATION_CODES: ${INMET_STATION_CODES:-[]}
      INMET_TIMEOUT_SECONDS: ${INMET_TIMEOUT_SECONDS:-8}
      INMET_MAX_RESPONSE_BYTES: ${INMET_MAX_RESPONSE_BYTES:-2000000}
      INMET_SYNC_INTERVAL_MINUTES: ${INMET_SYNC_INTERVAL_MINUTES:-60}

volumes:
  mysql_data:
